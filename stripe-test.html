<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stripe Test Payment</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 80px auto;
    padding: 30px;
    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #666;
    line-height: 1.6;
}

.price {
    font-size: 48px;
    font-weight: bold;
    margin: 40px 0;
}

button {
    border: none;
    padding: 16px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.note {
    margin-top: 30px;
    font-size: 14px;
    color: #888;
}
</style>
</head>

<body>

<h1>Stripe Test Payment</h1>

<p>This is a temporary Stripe Sandbox test.</p>

<div class="price">€0.10</div>

<button id="payButton" onclick="startTestPayment()">
    Pay €0.10 Test Payment
</button>

<div class="note">
    No real money will be charged.
</div>

<script>

const STRIPE_TEST_ENDPOINT =
    'https://teacher-xiao-stripe.lotsofwang.workers.dev';

async function startTestPayment() {

    const button = document.getElementById('payButton');

    button.disabled = true;
    button.innerText = 'Connecting to Stripe...';

    try {

        const response = await fetch(STRIPE_TEST_ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                testPayment: true
            })
        });

        const data = await response.json();

        if (!response.ok || !data.url) {
            throw new Error(
                data.error || 'Unable to create Stripe Checkout session.'
            );
        }

        window.location.href = data.url;

    } catch (error) {

        console.error(error);

        alert(
            'Something went wrong: ' +
            error.message
        );

        button.disabled = false;
        button.innerText = 'Pay €0.10 Test Payment';
    }
}

</script>

</body>
</html>
